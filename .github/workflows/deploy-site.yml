name: Deploy site (Astro) to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Chiamato da beta-toggle.yml dopo aver aggiornato src/data/beta.json.
  workflow_call:
    inputs:
      ref:
        description: Ref da buildare (vuoto = il commit dell'evento)
        type: string
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Da beta-toggle il commit dell'evento è quello di prima del cambio:
          # serve la punta di main appena aggiornata.
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
